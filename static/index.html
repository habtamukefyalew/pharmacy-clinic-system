<!DOCTYPE html><html lang="am"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TanaCloud Pharmacy & Clinic</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",sans-serif}body{margin:0;background:#f1f5f9;color:#1e293b}
#loginGate{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:9999}
.lcard{background:#fff;padding:26px;border-radius:12px;width:360px;text-align:center}
.lcard input{width:100%;padding:10px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:6px}
.lcard button{width:100%;padding:11px;background:#0284c7;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:#0f172a;padding:12px 20px;color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid #38bdf8;padding:8px 13px;border-radius:6px;cursor:pointer;font-weight:600}
.tbtn.act{background:#0284c7}
.wrap{max-width:1200px;margin:16px auto;padding:0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;padding:14px;border-radius:10px;border-left:4px solid #0284c7}
.card{background:#fff;padding:18px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.grid input,.grid select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px}
.btn{background:#0284c7;color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
th{background:#0f172a;color:#fff;padding:9px;text-align:left}td{padding:8px;border-bottom:1px solid #e2e8f0}
</style>
<script>
function showTab(id,b){document.querySelectorAll(".pnl").forEach(function(p){p.style.display="none"});document.querySelectorAll(".tbtn").forEach(function(x){x.classList.remove("act")});document.getElementById(id).style.display="block";if(b)b.classList.add("act")}
function login(){if(document.getElementById("u").value==="admin"){if(document.getElementById("p").value==="admin123"){sessionStorage.setItem("ok","1");document.getElementById("loginGate").style.display="none";loadAll();return}}alert("Wrong login")}
async function loadAll(){var r1=await fetch("/api/medicines");var r2=await fetch("/api/sales");var r3=await fetch("/api/patients");var meds=await r1.json();var sales=await r2.json();var pats=await r3.json();document.getElementById("kMed").innerText=meds.length;var mb=document.getElementById("medBody");var sel=document.getElementById("selMed");mb.innerHTML="";sel.innerHTML="";meds.forEach(function(m){mb.innerHTML+="<tr><td>"+m.name+"</td><td>"+m.category+"</td><td>"+m.buy_price+"</td><td>"+m.sell_price+"</td><td>"+m.stock+"</td><td>"+m.expiry_date+"</td></tr>";sel.innerHTML+="<option value=\""+m.id+"\">"+m.name+" ("+m.sell_price+" ETB | Stock:"+m.stock+")</option>"});var ts=0,tp=0,sb=document.getElementById("saleBody");sb.innerHTML="";sales.forEach(function(s){ts+=s.total_price;tp+=s.profit;sb.innerHTML+="<tr><td>"+s.sale_time+"</td><td>"+s.customer_name+"</td><td>"+s.medicine_name+"</td><td>"+s.quantity+"</td><td>"+s.total_price+"</td><td>"+s.profit+"</td></tr>"});document.getElementById("kSale").innerText=ts+" ETB";document.getElementById("kProf").innerText=tp+" ETB";var pb=document.getElementById("patBody");pb.innerHTML="";pats.forEach(function(p){pb.innerHTML+="<tr><td>"+p.visit_date+"</td><td>"+p.full_name+"</td><td>"+p.phone+"</td><td>"+p.diagnosis+"</td><td>"+p.prescription+"</td></tr>"})}
async function sell(){var r=await fetch("/api/sales",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({medicine_id:document.getElementById("selMed").value,quantity:document.getElementById("sQty").value,customer_name:document.getElementById("sCust").value||"Walk-in",payment_method:document.getElementById("sPay").value})});if(!r.ok){var e=await r.json();alert(e.detail);return}alert("Sale Recorded!");loadAll()}
async function addMed(){var r=await fetch("/api/medicines",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("mName").value,category:document.getElementById("mCat").value,buy_price:document.getElementById("mBuy").value,sell_price:document.getElementById("mSell").value,stock:document.getElementById("mStk").value,expiry_date:document.getElementById("mExp").value})});if(!r.ok){var e=await r.json();alert(e.detail);return}document.getElementById("mName").value="";alert("Medicine Added!");loadAll()}
async function addPat(){var r=await fetch("/api/patients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name:document.getElementById("pName").value,phone:document.getElementById("pPhone").value,age_gender:document.getElementById("pAge").value,diagnosis:document.getElementById("pDiag").value,prescription:document.getElementById("pPresc").value})});if(!r.ok){var e=await r.json();alert(e.detail);return}document.getElementById("pName").value="";alert("Patient Saved!");loadAll()}
window.onload=function(){if(sessionStorage.getItem("ok")==="1")document.getElementById("loginGate").style.display="none";loadAll()}
</script></head><body>
<div id="loginGate"><div class="lcard"><h2>TanaCloud Pharmacy</h2><p>admin / admin123</p><input id="u" value="admin"><input id="p" type="password" placeholder="admin123"><button type="button" onclick="login()">Login</button></div></div>
<div class="nav"><strong style="color:#38bdf8;font-size:18px">TanaCloud Pharmacy & Clinic</strong><div class="tabs">
<button type="button" class="tbtn act" onclick="showTab(\x27pPos\x27,this)">POS ሽያጭ</button>
<button type="button" class="tbtn" onclick="showTab(\x27pInv\x27,this)">መድኃኒት ክምችት</button>
<button type="button" class="tbtn" onclick="showTab(\x27pCli\x27,this)">ክሊኒክ ታካሚዎች</button>
<button type="button" class="tbtn" onclick="showTab(\x27pSal\x27,this)">የሽያጭ ታሪክ</button>
<button type="button" class="tbtn" style="background:#dc2626" onclick="sessionStorage.removeItem(\x27ok\x27);document.getElementById(\x27loginGate\x27).style.display=\x27flex\x27">ውጣ</button>
</div></div>
<div class="wrap">
<div class="kpis"><div class="kpi">መድኃኒቶች<h2 id="kMed">0</h2></div><div class="kpi">ጠቅላላ ሽያጭ<h2 id="kSale">0 ETB</h2></div><div class="kpi">የተጣራ ትርፍ<h2 id="kProf" style="color:#059669">0 ETB</h2></div></div>
<div id="pPos" class="pnl card"><h3>ፈጣን ሽያጭ (POS)</h3><div class="grid"><select id="selMed"></select><input id="sQty" type="number" value="1"><input id="sCust" placeholder="Customer"><select id="sPay"><option>Cash</option><option>Telebirr</option><option>Bank</option></select></div><button type="button" class="btn" style="margin-top:10px;background:#059669" onclick="sell()">ሽያጭ አጽድቅ</button></div>
<div id="pInv" class="pnl card" style="display:none"><h3>መድኃኒት መመዝገቢያ</h3><div class="grid"><input id="mName" placeholder="Medicine Name"><input id="mCat" value="Antibiotic"><input id="mBuy" type="number" placeholder="Buy Price"><input id="mSell" type="number" placeholder="Sell Price"><input id="mStk" type="number" placeholder="Stock"><input id="mExp" type="date" value="2027-12-30"></div><button type="button" class="btn" style="margin-top:10px" onclick="addMed()">መድኃኒት መዝግብ</button><table><thead><tr><th>Name</th><th>Category</th><th>Buy</th><th>Sell</th><th>Stock</th><th>Expiry</th></tr></thead><tbody id="medBody"></tbody></table></div>
<div id="pCli" class="pnl card" style="display:none"><h3>የታካሚ መመዝገቢያ</h3><div class="grid"><input id="pName" placeholder="Patient Name"><input id="pPhone" placeholder="Phone"><input id="pAge" placeholder="Age/Gender"><input id="pDiag" placeholder="Diagnosis"><input id="pPresc" placeholder="Prescription"></div><button type="button" class="btn" style="margin-top:10px" onclick="addPat()">ታካሚ መዝግብ</button><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Diagnosis</th><th>Prescription</th></tr></thead><tbody id="patBody"></tbody></table></div>
<div id="pSal" class="pnl card" style="display:none"><h3>የሽያጭ ታሪክ</h3><table><thead><tr><th>Time</th><th>Customer</th><th>Medicine</th><th>Qty</th><th>Total</th><th>Profit</th></tr></thead><tbody id="saleBody"></tbody></table></div>
</div></body></html>
